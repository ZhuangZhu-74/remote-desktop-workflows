name: RICH LINUX (XFCE) - FIXED

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Setup cloudflared
        uses: AnimMouse/setup-cloudflared@v2

      - name: Install xfce
        run: |
          sudo apt-get update
          
          # Remove heavy tools that cause hangs
          sudo apt-get remove -y --purge man-db firewalld ufw || true

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-goodies \
            nautilus dbus-x11 x11-xserver-utils xorg \
            adwaita-icon-theme-full fonts-cantarell
          
          echo "✅ GUI Installed (Lightweight Mode)"

      - name: Install XRDP (Remote Desktop)
        run: |
          sudo apt-get install -y --no-install-recommends xrdp
          sudo adduser xrdp ssl-cert
          
          # Configure XRDP to use xfce
          echo "xfce-session" > ~/.xsession
            
          sudo sed -i 's/3389/3389/g' /etc/xrdp/xrdp.ini
          sudo systemctl enable xrdp
          sudo service xrdp start

      - name: Install Antigravity (Chrome)
        run: |
          # VS Code
          # wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
          # sudo install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
          # echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null
          # sudo apt-get update
          # sudo apt-get install -y code

          # Chrome (for Antigravity)
          wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt install -y ./google-chrome-stable_current_amd64.deb || sudo apt-get install -f -y

          # Desktop Shortcut
          mkdir -p ~/Desktop
          cat > ~/Desktop/Antigravity.desktop <<EOF
          [Desktop Entry]
          Version=1.0
          Name=Google Antigravity
          Exec=google-chrome --app=https://antigravity.google/ --no-sandbox
          Icon=google-chrome
          Type=Application
          EOF
          chmod +x ~/Desktop/Antigravity.desktop

      - name: Setup User (runner)
        run: |
          sudo useradd -m -s /bin/bash runner || true
          echo "runner:Antigravity2026!" | sudo chpasswd
          sudo usermod -aG sudo runner

      #- name: Start Cloudflare Tunnel
      #  uses: AnimMouse/setup-cloudflared/tunnel@v2
      #  with:
      #    url: tcp://localhost:3389  # xrdp default port

      - name: debug use ssh and rdp
        run: |
          nohup cloudflared tunnel --url tcp://localhost:22 --metries localhost:9091 &
          nohup cloudflared tunnel --url tcp://localhost:3389 --metries localhost:9092 &
          sleep 15

      - name: Keep Alive
        run: sleep 21600
